<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Crystal Brazil</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #faf9f6;
  font-family: Arial, sans-serif;
}

.inicio {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.capa {
  position: relative;
  width: min(100vw, 56.25dvh);
  height: 100dvh;
}

.capa img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.botao-menu {
  position: absolute;
  top: 72%;
  left: 50%;
  transform: translateX(-50%);
  border: none;
  background: transparent;
  padding: 12px;
  cursor: pointer;
}

.botao-menu span {
  display: block;
  width: 42px;
  height: 6px;
  margin: 7px 0;
  border-radius: 8px;
  background: linear-gradient(
    #8b5805,
    #ffe18a,
    #c18a19,
    #805006
  );
  box-shadow: 0 2px 5px #9b761d88;
}

.menu {
  position: absolute;
  top: 82%;
  left: 50%;
  transform: translateX(-50%);
  background: #ffffffed;
  border: 1px solid #c79b3b;
  border-radius: 12px;
  padding: 16px 28px;
  text-align: center;
  box-shadow: 0 8px 25px #0002;
}

.menu[hidden] {
  display: none;
}

.menu a {
  display: block;
  padding: 9px;
  color: #946812;
  text-decoration: none;
}
</style>
<link rel="icon" type="image/png" href="assets/logo-institucional.png?v=2">
</head>

<body>

<main class="inicio" id="inicio">
  <div class="capa">

    <img
      src="assets/capa.png"
      alt="Golden Crystal Brazil"
    >

    <button
      class="botao-menu"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="menu"
      onclick="window.location.href='menu.html'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="menu" id="menu" hidden>
      <a href="#inicio">Início</a>
      <a href="#institucional">Institucional</a>
      <a href="#mineracao">Mineração</a>
      <a href="#projetos">Projetos</a>
      <a href="#contato">Contato</a>
    </nav>

  </div>
</main>

<script>
function alternarMenu(botao) {
  const menu = document.getElementById("menu");

  menu.hidden = !menu.hidden;

  botao.setAttribute(
    "aria-expanded",
    String(!menu.hidden)
  );
}
</script>

</body>
</html>
